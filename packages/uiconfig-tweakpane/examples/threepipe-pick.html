<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Threepipe example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body, #canvas-container, #mcanvas {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
  </style>

</head>

<body style="background: #111;">
<div id="canvas-container">
  <canvas id="mcanvas"></canvas>
</div>
<script type="module">
  import {ThreeViewer, Color, Vector2, Vector3, Vector4, Texture, PickingPlugin, getOrCall} from 'https://threepipe.org/dist/index.mjs'
  import {UI} from '../src/index.ts'

  const viewer = new ThreeViewer({canvas: document.getElementById('mcanvas')})

  // Load an environment map
  const envPromise = viewer.setEnvironmentMap('https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr')
  const modelPromise = viewer.load('https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf', {
    autoCenter: true,
    autoScale: true,
  })

  // Create a UI for the data object
  const ui = new UI();
  ui.THREE = {Color, Vector2, Vector3, Vector4, Texture}
  ui.fileLoader = viewer
  viewer.uiConfig.children.forEach(child => ui.appendChild(child))

  Promise.all([envPromise, modelPromise]).then(([env, model])=>{
    console.log('Loaded', model, env, viewer)
    const mesh = model.getObjectByName('node_damagedHelmet_-6514')
    // ui.appendChild(mesh.uiConfig)
  })
  window.ui = ui

  let temp = true
  let selected = null
  const refreshUi = ()=>{
    uiConfig.children = [...ch1]
    if(selected) {
      const ch = selected.uiConfig.children.map(f=>getOrCall(f)).filter(f=>f && f.label !== 'Physical Material')
      const mat = selected.material
      uiConfig.children.push(ch)
      if(mat && mat.uiConfig){
        if(!temp)
          uiConfig.children.push(mat.uiConfig)
        else
          uiConfig.children = [mat.uiConfig, ...uiConfig.children]
        temp = !temp
      }
    }else {
      uiConfig.children.push({
        type: 'button',
        label: 'Select a mesh by clicking on it',
        disabled: true,
      })
    }
    uiConfig.uiRefresh?.(true)
  }
  const ch1 = [
    {
      type: 'button',
      label: 'Refresh',
      value: refreshUi,
    }
  ]

  const picking = viewer.addPluginSync(PickingPlugin)
  picking.addEventListener('selectedObjectChanged', ()=>{
    selected = picking.getSelectedObject()
    refreshUi()
  })

  const uiConfig = {
    type: 'folder',
    label: 'Selected Mesh',
    expanded: true,
    children: []
  }
  ui.appendChild(uiConfig)


</script>
</body>
</html>
