# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build the website and docs and deploy to github pages.

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    # npm ci does not build (prepack, not prepare). `npm run pages` builds uiconfig.js and its docs, the renderers
    # and their docs, the example pages of the three packages and the landing page (website/), then assembles
    # website/_site: the landing page at the root, docs/ (with docs/uiconfig-tweakpane/ and docs/uiconfig-blueprint/),
    # examples/ (with examples/uiconfig-tweakpane/ and examples/uiconfig-blueprint/), dist/, and redirect pages at
    # the old TypeDoc paths. See website/README.md.
    - run: npm run pages
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'website/_site'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
