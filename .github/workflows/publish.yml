# Publishes each public package in packages/* whose version is not on npm yet.
# Release a package: bump "version" in its package.json, add the matching section to its
# CHANGELOG.md, push to master. A Discord notice (secret DISCORD_WEBHOOK_URL) links the run; the
# publish job waits for approval of the npm-publish environment.
# Each package needs a trusted publisher on npmjs.com: repository repalash/uiconfig.js,
# workflow publish.yml, environment npm-publish.

name: Publish packages to npm

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.check.outputs.packages }}
      has_packages: ${{ steps.check.outputs.has_packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the commit list in the Discord notice
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Find versions that are not on npm (and check their CHANGELOG entries)
        id: check
        run: node scripts/ci/publish-check.mjs
      - name: Notify Discord
        if: always() && (steps.check.outputs.has_packages == 'true' || steps.check.outcome == 'failure')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PACKAGES: ${{ steps.check.outputs.packages || '[]' }}
          CHECK_OK: ${{ steps.check.outcome == 'success' }}
        run: node .github/scripts/notify-discord.mjs

  publish:
    needs: check
    if: needs.check.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # push the release tags <name>-<version>
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Build, check and publish
        env:
          PUBLISH_PACKAGES: ${{ needs.check.outputs.packages }}
        run: node scripts/ci/publish-packages.mjs
